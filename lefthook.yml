pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm eslint {staged_files} --fix
    prettier:
      glob: "*.{js,ts,jsx,tsx,json,md,css}"
      run: pnpm prettier --write {staged_files}
    typecheck:
      run: pnpm tsc --noEmit
    build:
      run: pnpm run build
